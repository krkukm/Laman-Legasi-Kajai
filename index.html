function pageReps(){

  const filter=window.repFilter||{};

  let list=[...data.reps];

  if(filter.batch){
    list=list.filter(x=>String(x.batch)===String(filter.batch));
  }

  if(filter.status){
    list=list.filter(x=>x.status===filter.status);
  }

  if(filter.q){

    const q=filter.q.toLowerCase();

    list=list.filter(x=>
      [x.name,x.email,x.phone,x.notes]
      .join(" ")
      .toLowerCase()
      .includes(q)
    );

  }

  list.sort((a,b)=>Number(a.batch)-Number(b.batch));

  return `

    <div class="page-header">

      <div>
        <h1 class="page-title">Wakil Batch</h1>
        <p class="page-subtitle">
          Rekod wakil bagi setiap batch, termasuk wakil utama dan wakil kedua.
        </p>
      </div>

      <div class="header-actions">

        <button class="btn btn-primary" onclick="openRepForm()">
          + ${isAdmin() ? "Tambah Wakil" : "Cadang Wakil"}
        </button>

      </div>

    </div>


    <div class="card">

      <div class="filters">

        <input
          id="repQ"
          placeholder="Cari nama wakil..."
          value="${esc(filter.q||"")}"
          oninput="applyRepFilters()"
        >

        <select id="repBatch" onchange="applyRepFilters()">
          <option value="">Semua batch</option>
          ${yearList().map(y=>`
            <option value="${y}" ${String(filter.batch)===String(y)?"selected":""}>
              ${y}
            </option>
          `).join("")}
        </select>

        <select id="repStatus" onchange="applyRepFilters()">
          <option value="">Semua status</option>
          <option ${filter.status==="Utama"?"selected":""}>Utama</option>
          <option ${filter.status==="Kedua"?"selected":""}>Kedua</option>
        </select>

      </div>


      ${
        list.length
        ?
        `<div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>Batch</th>
                <th>Nama</th>
                <th>Status</th>
                <th>Hubungan</th>
                <th>Tahun Dilantik</th>
                <th>Tindakan</th>
              </tr>
            </thead>

            <tbody>

              ${list.map(r=>`

                <tr>

                  <td><strong>${esc(r.batch)}</strong></td>

                  <td>
                    <strong>${esc(r.name)}</strong>
                    <div class="small muted">
                      ${esc(r.notes||"")}
                    </div>
                  </td>

                  <td>
                    ${statusBadge(r.status)}
                  </td>

                  <td>
                    ${privateField(r.phone,r.phoneVisibility)}
                    <div>${privateField(r.email,r.emailVisibility)}</div>
                  </td>

                  <td>${esc(r.appointedYear||"-")}</td>

                  <td>

                    <div class="action-row">

                      <button class="btn btn-small"
                        onclick="openRepForm('${r.id}')">
                        ${isAdmin() ? "Edit" : "Cadang Edit"}
                      </button>

                      ${
                        isAdmin()
                        ?
                        `<button class="btn btn-small btn-danger"
                          onclick="deleteRep('${r.id}')">
                          Padam
                        </button>`
                        :""
                      }

                    </div>

                  </td>

                </tr>

              `).join("")}

            </tbody>

          </table>

        </div>`
        :
        empty("◎","Tiada wakil batch","")
      }

    </div>

  `;

}

function applyRepFilters(){

  window.repFilter={
    q:document.getElementById("repQ").value,
    batch:document.getElementById("repBatch").value,
    status:document.getElementById("repStatus").value
  };

  render();

}

function openRepForm(id=""){

  const existing=id ? data.reps.find(x=>x.id===id):null;

  const r=existing||{};

  openModal(
    existing
      ? (isAdmin() ? "Edit Wakil Batch" : "Cadangkan Perubahan Wakil")
      : (isAdmin() ? "Tambah Wakil Batch" : "Cadangkan Wakil Batch"),
    `

      <form class="form-grid"
        onsubmit="submitRepForm(event,'${esc(id)}')">

        ${selectField(
          "Batch",
          "batch",
          yearList(),
          r.batch,
          true
        )}

        ${inputField("Nama Wakil","name",r.name,"text",true)}

        ${selectField(
          "Status",
          "status",
          ["Utama","Kedua"],
          r.status||"Utama",
          true
        )}

        ${inputField("No. Telefon","phone",r.phone)}

        ${selectField(
          "Keterlihatan Telefon",
          "phoneVisibility",
          ["Dalaman Sahaja","Pasukan Sahaja","Boleh Dipaparkan"],
          r.phoneVisibility||data.config.privacyDefault
        )}

        ${inputField("E-mel","email",r.email,"email")}

        ${selectField(
          "Keterlihatan E-mel",
          "emailVisibility",
          ["Dalaman Sahaja","Pasukan Sahaja","Boleh Dipaparkan"],
          r.emailVisibility||data.config.privacyDefault
        )}

        ${inputField("Tahun Dilantik","appointedYear",r.appointedYear,"number")}

        ${textareaField("Catatan","notes",r.notes)}

        ${
          !isAdmin()
          ?
          `
            <div class="form-group full">
              <label>Nota Cadangan</label>
              <textarea id="suggestionReason" required></textarea>
            </div>
          `
          :""
        }

        <div class="form-actions">

          <button type="button" class="btn" onclick="closeModal()">Batal</button>

          <button class="btn btn-primary">
            ${isAdmin() ? "Simpan":"Hantar Cadangan"}
          </button>

        </div>

      </form>

    `,
    "Wakil batch",
    true
  );

}

function submitRepForm(e,id){

  e.preventDefault();

  const obj=Object.fromEntries(new FormData(e.target).entries());

  obj.batch=Number(obj.batch);
  obj.appointedYear=obj.appointedYear ? Number(obj.appointedYear):"";
  obj.updatedAt=now();

  if(isAdmin()){

    if(id){

      const existing=data.reps.find(x=>x.id===id);

      if(existing) Object.assign(existing,obj);

    }else{

      obj.id=uid("rep");
      obj.createdAt=now();

      data.reps.push(obj);

    }

    ensureBatch(obj.batch);

    audit(id ? "Mengemas kini wakil":"Menambah wakil","Wakil Batch",id);

    save();
    closeModal();
    render();

    toast("Wakil batch disimpan.","success");

  }else{

    const reason=document.getElementById("suggestionReason")?.value||"";

    submitSuggestion(
      id ? "rep_edit":"rep_add",
      id,
      obj,
      reason,
      id ? data.reps.find(x=>x.id===id):null
    );

    closeModal();

    toast("Cadangan wakil dihantar.","success");

  }

}

function deleteRep(id){

  if(!isAdmin()) return;

  if(!confirm("Padam wakil batch ini?")) return;

  data.reps=data.reps.filter(x=>x.id!==id);

  audit("Memadam wakil batch","Wakil Batch",id);

  save();

  render();

  toast("Wakil dipadam.","success");

}


/* =========================================================
   KARISMA RECORDS
========================================================= */

function pageRecords(){

  const filter=window.recordFilter||{};

  let list=[...data.records];

  if(filter.status){
    list=list.filter(x=>x.status===filter.status);
  }

  if(filter.unit){
    list=list.filter(x=>x.unitId===filter.unit);
  }

  if(filter.q){

    const q=filter.q.toLowerCase();

    list=list.filter(x=>
      [
        x.program,
        x.alumniName,
        x.role,
        x.evidence,
        x.notes
      ].join(" ").toLowerCase().includes(q)
    );

  }

  list.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));

  return `

    <div class="page-header">

      <div>
        <h1 class="page-title">Rekod Penglibatan</h1>
        <p class="page-subtitle">
          Rekod aktiviti KARISMA dan merit berdasarkan penglibatan alumni,
          biro, kelab dan jaringan luar.
        </p>
      </div>

      <div class="header-actions">

        <button class="btn btn-primary" onclick="openRecordForm()">
          + ${isAdmin() ? "Tambah Rekod" : "Cadang Rekod"}
        </button>

      </div>

    </div>


    <div class="grid grid-4">

      ${statCard("✓",approvedRecords().length,"Diluluskan","Rekod merit aktif")}

      ${statCard("!",data.records.filter(x=>x.status==="Menunggu").length,
        "Menunggu","Perlu pengesahan")}

      ${statCard("★",totalMerit().toFixed(0),"Jumlah Merit","Semua unit")}

      ${statCard("◈",new Set(data.records.map(x=>x.program)).size,
        "Program","Program direkod")}

    </div>


    <div style="height:16px"></div>


    <div class="card">

      <div class="filters">

        <input
          id="recordQ"
          placeholder="Cari program, alumni, peranan..."
          value="${esc(filter.q||"")}"
          oninput="applyRecordFilters()"
        >

        <select id="recordStatus" onchange="applyRecordFilters()">
          <option value="">Semua status</option>
          <option ${filter.status==="Diluluskan"?"selected":""}>Diluluskan</option>
          <option ${filter.status==="Menunggu"?"selected":""}>Menunggu</option>
          <option ${filter.status==="Ditolak"?"selected":""}>Ditolak</option>
        </select>

        <select id="recordUnit" onchange="applyRecordFilters()">
          <option value="">Semua unit</option>
          ${data.units.map(u=>`
            <option value="${u.id}" ${filter.unit===u.id?"selected":""}>
              ${esc(u.name)}
            </option>
          `).join("")}
        </select>

      </div>


      ${
        list.length
        ?
        `<div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>Program</th>
                <th>Tarikh</th>
                <th>Unit</th>
                <th>Penglibatan</th>
                <th>Formula</th>
                <th>Merit</th>
                <th>Status</th>
                <th>Tindakan</th>
              </tr>
            </thead>

            <tbody>

              ${list.map(r=>{

                const base=Number(r.basePoints||0);
                const bonus=Number(r.bonusPoints||0);
                const penalty=Number(r.penaltyPoints||0);
                const scale=Number(r.scale||1);

                return `
                  <tr>

                    <td>
                      <strong>${esc(r.program)}</strong>
                      <div class="small muted">
                        ${esc(r.alumniName||"")}
                      </div>
                    </td>

                    <td>${dateMY(r.date)}</td>

                    <td>
                      ${esc(getUnit(r.unitId)?.name || r.unitName || "-")}
                    </td>

                    <td>
                      ${esc(r.role||"-")}
                    </td>

                    <td class="small">
                      (${base} + ${bonus} − ${penalty}) × ${scale}
                    </td>

                    <td>
                      <strong>${merit(r).toFixed(1)}</strong>
                    </td>

                    <td>
                      ${statusBadge(r.status)}
                    </td>

                    <td>

                      <div class="action-row">

                        <button class="btn btn-small"
                          onclick="openRecordForm('${r.id}')">
                          ${isAdmin() ? "Edit" : "Cadang Edit"}
                        </button>

                        ${
                          isAdmin()
                          ?
                          `<button class="btn btn-small btn-danger"
                            onclick="deleteRecord('${r.id}')">
                            Padam
                          </button>`
                          :""
                        }

                      </div>

                    </td>

                  </tr>
                `;

              }).join("")}

            </tbody>

          </table>

        </div>`
        :
        empty("✓","Tiada rekod","Tambah rekod penglibatan KARISMA.")
      }

    </div>

  `;

}

function applyRecordFilters(){

  window.recordFilter={
    q:document.getElementById("recordQ").value,
    status:document.getElementById("recordStatus").value,
    unit:document.getElementById("recordUnit").value
  };

  render();

}

function openRecordForm(id=""){

  const existing=id ? data.records.find(x=>x.id===id):null;

  const r=existing||{};

  openModal(
    existing
      ? (isAdmin() ? "Edit Rekod Penglibatan":"Cadangkan Perubahan Rekod")
      : (isAdmin() ? "Tambah Rekod Penglibatan":"Cadangkan Rekod Penglibatan"),
    `

      <form class="form-grid"
        onsubmit="submitRecordForm(event,'${esc(id)}')">

        ${inputField("Nama Program","program",r.program,"text",true)}

        ${inputField("Tarikh","date",r.date ? String(r.date).slice(0,10):"", "date",true)}

        <div class="form-group">
          <label>Unit</label>
          <select name="unitId" required>
            <option value="">-- Pilih unit --</option>
            ${data.units.map(u=>`
              <option value="${u.id}" ${r.unitId===u.id?"selected":""}>
                ${esc(u.name)}
              </option>
            `).join("")}
          </select>
        </div>

        ${inputField("Nama Alumni / Individu","alumniName",r.alumniName)}

        <div class="form-group">
          <label>Alumni Pautan</label>
          <select name="alumniId">
            <option value="">-- Tiada pautan --</option>
            ${data.alumni.map(a=>`
              <option value="${a.id}" ${r.alumniId===a.id?"selected":""}>
                ${esc(a.fullName)} — ${esc(a.batch)}
              </option>
            `).join("")}
          </select>
        </div>

        ${inputField("Peranan","role",r.role,"text",true)}

        ${selectField(
          "Skala",
          "scale",
          [
            {value:"1",label:"1.0 — Aktiviti biasa"},
            {value:"1.5",label:"1.5 — Skala sederhana"},
            {value:"2",label:"2.0 — Skala tinggi"}
          ],
          String(r.scale||1)
        )}

        ${selectField(
          "Mata Asas",
          "basePoints",
          data.scores.map(s=>({
            value:String(s.points),
            label:`${s.points} — ${s.name}`
          })),
          String(r.basePoints||0)
        )}

        ${selectField(
          "Bonus",
          "bonusPoints",
          [
            {value:"0",label:"0 — Tiada bonus"},
            ...data.bonuses.map(s=>({
              value:String(s.points),
              label:`${s.points} — ${s.name}`
            }))
          ],
          String(r.bonusPoints||0)
        )}

        ${selectField(
          "Penalti",
          "penaltyPoints",
          [
            {value:"0",label:"0 — Tiada penalti"},
            ...data.penalties.map(s=>({
              value:String(s.points),
              label:`${s.points} — ${s.name}`
            }))
          ],
          String(r.penaltyPoints||0)
        )}

        ${selectField(
          "Status",
          "status",
          ["Menunggu","Diluluskan","Ditolak"],
          r.status || (isAdmin() ? "Diluluskan":"Menunggu")
        )}

        ${inputField("Bukti / Pautan Evidence","evidence",r.evidence)}

        ${textareaField("Catatan","notes",r.notes)}

        ${
          !isAdmin()
          ?
          `
            <div class="form-group full">
              <label>Nota Cadangan</label>
              <textarea id="suggestionReason" required></textarea>
            </div>
          `
          :""
        }

        <div class="form-actions">

          <button type="button" class="btn" onclick="closeModal()">
            Batal
          </button>

          <button class="btn btn-primary">
            ${isAdmin() ? "Simpan":"Hantar Cadangan"}
          </button>

        </div>

      </form>

    `,
    "Formula: (mata asas + bonus − penalti) × skala",
    true
  );

}

function submitRecordForm(e,id){

  e.preventDefault();

  const obj=Object.fromEntries(new FormData(e.target).entries());

  obj.basePoints=Number(obj.basePoints||0);
  obj.bonusPoints=Number(obj.bonusPoints||0);
  obj.penaltyPoints=Number(obj.penaltyPoints||0);
  obj.scale=Number(obj.scale||1);
  obj.updatedAt=now();

  const linked=getAlumni(obj.alumniId);

  if(linked){
    obj.alumniName=linked.fullName;
  }

  if(isAdmin()){

    if(id){

      const existing=data.records.find(x=>x.id===id);

      if(existing) Object.assign(existing,obj);

    }else{

      obj.id=uid("record");
      obj.createdAt=now();

      data.records.push(obj);

    }

    audit(
      id ? "Mengemas kini rekod KARISMA":"Menambah rekod KARISMA",
      "Rekod Penglibatan",
      id
    );

    save();

    closeModal();
    render();

    toast("Rekod KARISMA disimpan.","success");

  }else{

    const reason=document.getElementById("suggestionReason")?.value||"";

    submitSuggestion(
      id ? "record_edit":"record_add",
      id,
      obj,
      reason,
      id ? data.records.find(x=>x.id===id):null
    );

    closeModal();

    toast("Cadangan rekod dihantar.","success");

  }

}

function deleteRecord(id){

  if(!isAdmin()) return;

  if(!confirm("Padam rekod penglibatan ini?")) return;

  data.records=data.records.filter(x=>x.id!==id);

  audit("Memadam rekod KARISMA","Rekod Penglibatan",id);

  save();

  render();

  toast("Rekod dipadam.","success");

}


/* =========================================================
   MERIT SETTINGS
========================================================= */

function pageMerit(){

  return `

    <div class="page-header">

      <div>
        <h1 class="page-title">Sistem Merit KARISMA</h1>
        <p class="page-subtitle">
          Tetapkan mata asas, bonus dan penalti yang digunakan dalam
          pengiraan rekod penglibatan.
        </p>
      </div>

    </div>


    <div class="grid grid-3">

      ${meritTable("Mata Asas","scores",data.scores)}

      ${meritTable("Bonus","bonuses",data.bonuses)}

      ${meritTable("Penalti","penalties",data.penalties)}

    </div>

  `;

}

function meritTable(title,type,list){

  return `
    <div class="card">

      <div class="card-head">

        <div>
          <div class="card-title">${esc(title)}</div>
          <div class="small muted">${list.length} item</div>
        </div>

        <button class="btn btn-small btn-primary"
          onclick="openMeritForm('${type}')">
          + Tambah
        </button>

      </div>

      <div class="metric-list">

        ${list.map(x=>`
          <div class="metric">

            <div>
              <div class="metric-name">${esc(x.name)}</div>
              <div class="small muted">${x.points} mata</div>
            </div>

            <div class="action-row">

              <button class="btn btn-small"
                onclick="openMeritForm('${type}','${x.id}')">
                Edit
              </button>

              <button class="btn btn-small btn-danger"
                onclick="deleteMerit('${type}','${x.id}')">
                Padam
              </button>

            </div>

          </div>
        `).join("")}

      </div>

    </div>
  `;

}

function openMeritForm(type,id=""){

  const arr=data[type];

  const existing=id ? arr.find(x=>x.id===id):null;

  openModal(
    existing ? "Edit Mata":"Tambah Mata",
    `

      <form class="form-grid"
        onsubmit="submitMeritForm(event,'${type}','${esc(id)}')">

        ${inputField("Nama","name",existing?.name||"","text",true)}

        ${inputField("Mata","points",existing?.points||"","number",true)}

        <div class="form-actions">

          <button type="button" class="btn" onclick="closeModal()">Batal</button>

          <button class="btn btn-primary">Simpan</button>

        </div>

      </form>

    `,
    "Konfigurasi sistem merit"
  );

}

function submitMeritForm(e,type,id){

  e.preventDefault();

  const obj=Object.fromEntries(new FormData(e.target).entries());

  obj.points=Number(obj.points);

  if(id){

    const existing=data[type].find(x=>x.id===id);

    if(existing) Object.assign(existing,obj);

  }else{

    data[type].push({
      id:uid(type.slice(0,-1)),
      ...obj
    });

  }

  audit("Mengemas kini sistem merit",type,id);

  save();
  closeModal();
  render();

  toast("Konfigurasi merit disimpan.","success");

}

function deleteMerit(type,id){

  if(!confirm("Padam item merit ini?")) return;

  data[type]=data[type].filter(x=>x.id!==id);

  save();

  render();

  toast("Item merit dipadam.","success");

}

  const biro=data.units.filter(x=>x.type==="Biro");

  return `

      </button>

    </div>


    <div class="grid grid-2">

      ${unitGroup("Biro",biro)}
      ${unitGroup("Kelab",club)}

    </div>

}

function unitGroup(title,list){

  return `
    <div class="card">

      <div class="card-head">
        <div>
          <div class="card-title">${title}</div>
          <div class="small muted">${list.length} unit</div>
        </div>
      </div>

      <div class="metric-list">

        ${list.map(u=>`

          <div class="metric">

            <div>
              <div class="metric-name">${esc(u.name)}</div>

        `).join("")}

}

function openUnitForm(id=""){

  const existing=id ? getUnit(id):null;

  openModal(
    existing ? "Edit Unit":"Tambah Unit",
    `

      <form class="form-grid"
        onsubmit="submitUnitForm(event,'${esc(id)}')">

        ${selectField(
          "Jenis",
          "type",
          ["Biro","Kelab"],
          existing?.type||"Biro",
          true
        )}

        ${inputField(
          "Nama Unit",
          "name",
          existing?.name||"",
          "text",
          true
        )}

        <div class="form-actions">

          <button type="button" class="btn" onclick="closeModal()">Batal</button>

          <button class="btn btn-primary">Simpan</button>

        </div>

      </form>

    `,
    "Unit KARISMA"
  );

}

function submitUnitForm(e,id){

  e.preventDefault();

  const obj=Object.fromEntries(new FormData(e.target).entries());

  if(id){

    const existing=getUnit(id);

    if(existing) Object.assign(existing,obj);

  }else{

    data.units.push({
      id:uid("unit"),
      ...obj
    });

  }

  save();

  closeModal();

  render();

  toast("Unit berjaya disimpan.","success");

}

function deleteUnit(id){

  const used=data.records.some(r=>r.unitId===id);

  if(used){

    toast(
      "Unit tidak boleh dipadam kerana masih mempunyai rekod KARISMA.",
      "error"
    );

    return;

  }

  if(!confirm("Padam unit ini?")) return;

  data.units=data.units.filter(x=>x.id!==id);

  save();

  render();

  toast("Unit dipadam.","success");

}


/* =========================================================
   ACTIVITIES
========================================================= */

function pageActivities(){

  const filter=window.activityFilter||{};

  let list=[...data.activities];

  if(filter.q){

    const q=filter.q.toLowerCase();

function openActivityForm(id=""){

  const existing=id ? data.activities.find(x=>x.id===id):null;

  const x=existing||{};

    existing

        )}

          "Kategori",

          x.category,

        )}

        ${inputField("Peranan","role",x.role)}

        ${selectField(
          "Keterlihatan",
          "visibility",
          ["Dalaman Sahaja","Pasukan Sahaja","Boleh Dipaparkan"],
          x.visibility||"Dalaman Sahaja"
        )}

        ${textareaField("Catatan","notes",x.notes)}

        ${
          !isAdmin()
          ?
          `
            <div class="form-group full">
              <label>Nota Cadangan</label>
              <textarea id="suggestionReason" required></textarea>
            </div>
          `
          :""
        }

        <div class="form-actions">

          <button type="button" class="btn" onclick="closeModal()">Batal</button>

          <button class="btn btn-primary">
            ${isAdmin() ? "Simpan":"Hantar Cadangan"}
          </button>

        </div>

      </form>

    `,
    "Rekod aktiviti legasi",
    true
  );

}

function submitActivityForm(e,id){

  e.preventDefault();

  const obj=Object.fromEntries(new FormData(e.target).entries());

  obj.year=Number(obj.year);
  obj.updatedAt=now();
  obj.status="Diluluskan";

  const a=getAlumni(obj.alumniId);

  if(a){
    obj.alumniName=a.fullName;
    obj.batch=a.batch;
  }

  if(isAdmin()){

    if(id){

      const existing=data.activities.find(x=>x.id===id);

      if(existing) Object.assign(existing,obj);

    }else{

      obj.id=uid("activity");
      obj.createdAt=now();

      data.activities.push(obj);

    }

    audit(
      id ? "Mengemas kini aktiviti alumni":"Menambah aktiviti alumni",
      "Aktiviti Alumni",
      id
    );

    save();
    closeModal();
    render();

    toast("Aktiviti alumni disimpan.","success");

  }else{

    const reason=document.getElementById("suggestionReason")?.value||"";

    submitSuggestion(
      id ? "activity_edit":"activity_add",
      id,
      obj,
      reason,
      id ? data.activities.find(x=>x.id===id):null
    );

    closeModal();

    toast("Cadangan aktiviti dihantar.","success");

  }

}

function deleteActivity(id){

  if(!isAdmin()) return;

  if(!confirm("Padam aktiviti ini?")) return;

  data.activities=data.activities.filter(x=>x.id!==id);

  save();

  render();

  toast("Aktiviti dipadam.","success");

}

function submitSuggestion(type,targetId,changes,reason,oldData){

  data.suggestions.push({
    id:uid("suggestion"),
    type,
    targetId,
    submittedBy:currentRole,
    submittedAt:now(),
    changes,
    oldData,
    reason,
    status:"Menunggu",
    adminNote:""
  });

  audit(
    "Menghantar cadangan",
    type,
    targetId
  );

  save();

}

function suggestionSummary(s){

  const c=s.changes||{};

  if(s.type.includes("alumni")){
    return esc(c.fullName || "Cadangan alumni");
  }

  if(s.type.includes("leadership")){
    return esc(
      `${c.position||"Jawatan"} — ${c.name||""}`
    );
  }

  if(s.type.includes("rep")){
    return esc(
      `Batch ${c.batch||"-"} — ${c.name||""}`
    );
  }

  if(s.type.includes("activity")){
    return esc(c.title||"Cadangan aktiviti");
  }

  if(s.type.includes("achievement")){
    return esc(c.title||"Cadangan pencapaian");
  }

  if(s.type.includes("record")){
    return esc(c.program||"Cadangan rekod KARISMA");
  }

  return "Cadangan maklumat";

}

function approveSuggestion(id){

  if(!isAdmin()) return;

  const s=data.suggestions.find(x=>x.id===id);

  if(!s || s.status!=="Menunggu") return;

  applySuggestion(s);

  s.status="Diluluskan";
  s.adminNote="Diluluskan oleh Pentadbir.";

  audit("Meluluskan cadangan",s.type,id);

  save();

  render();

  toast("Cadangan diluluskan dan dimasukkan ke data rasmi.","success");

}

function rejectSuggestion(id){

  if(!isAdmin()) return;

  const s=data.suggestions.find(x=>x.id===id);

  if(!s || s.status!=="Menunggu") return;

  const note=prompt(
    "Catatan penolakan:",
    "Maklumat belum mencukupi."
  );

  s.status="Ditolak";
  s.adminNote=note||"Ditolak oleh Pentadbir.";

  audit("Menolak cadangan",s.type,id);

  save();

  render();

  toast("Cadangan ditolak.","success");

}

function applySuggestion(s){

  const c=s.changes||{};

  if(s.type==="alumni_add"){

    const obj={
      ...c,
      id:uid("alumni"),
      createdAt:now(),
      updatedAt:now()
    };

    data.alumni.push(obj);

    ensureBatch(Number(obj.batch));

    return;
  }

  if(s.type==="alumni_edit"){

    const target=getAlumni(s.targetId);

    if(target){
      Object.assign(target,c);
      target.updatedAt=now();
    }

    return;
  }

  if(s.type==="leadership_add"){

    data.leadership.push({
      ...c,
      id:uid("lead"),
      createdAt:now(),
      updatedAt:now()
    });

    ensureBatch(Number(c.yearFrom));

    return;
  }

  if(s.type==="leadership_edit"){

    const target=data.leadership.find(x=>x.id===s.targetId);

    if(target){
      Object.assign(target,c);
      target.updatedAt=now();
    }

    return;
  }

  if(s.type==="rep_add"){

    data.reps.push({
      ...c,
      id:uid("rep"),
      createdAt:now(),
      updatedAt:now()
    });

    ensureBatch(Number(c.batch));

    return;
  }

  if(s.type==="rep_edit"){

    const target=data.reps.find(x=>x.id===s.targetId);

    if(target){
      Object.assign(target,c);
      target.updatedAt=now();
    }

    return;
  }

  if(s.type==="record_add"){

    data.records.push({
      ...c,
      id:uid("record"),
      createdAt:now(),
      updatedAt:now(),
      status:c.status==="Ditolak" ? "Menunggu":"Diluluskan"
    });

    return;
  }

  if(s.type==="record_edit"){

    const target=data.records.find(x=>x.id===s.targetId);

    if(target){
      Object.assign(target,c);
      target.updatedAt=now();
    }

    return;
  }

  if(s.type==="activity_add"){

    data.activities.push({
      ...c,
      id:uid("activity"),
      createdAt:now(),
      updatedAt:now(),
      status:"Diluluskan"
    });

    return;
  }

  if(s.type==="activity_edit"){

    const target=data.activities.find(x=>x.id===s.targetId);

    if(target){
      Object.assign(target,c);
      target.updatedAt=now();
    }

    return;
  }

  if(s.type==="achievement_add"){

    data.achievements.push({
      ...c,
      id:uid("achievement"),
      createdAt:now(),
      updatedAt:now(),
      status:"Diluluskan"
    });

    return;
  }

  if(s.type==="achievement_edit"){

    const target=data.achievements.find(x=>x.id===s.targetId);

    if(target){
      Object.assign(target,c);
      target.updatedAt=now();
    }

  }

}

async function submitGalleryForm(e,id){

  e.preventDefault();

  const obj=Object.fromEntries(new FormData(e.target).entries());

  obj.year=Number(obj.year);

  const file=document.getElementById("galleryImage");

  let image="";

  if(file?.files?.[0]){
    image=await compressImage(file.files[0],1200,.7);
  }

  const existing=id ? data.gallery.find(x=>x.id===id):null;

  obj.image=image || existing?.image || "";
  obj.status="Diluluskan";
  obj.updatedAt=now();

  if(isAdmin()){

    if(id){

      if(existing) Object.assign(existing,obj);

    }else{

      data.gallery.push({
        ...obj,
        id:uid("gallery"),
        createdAt:now()
      });

    }

    save();

    closeModal();
    render();

    toast("Foto galeri disimpan.","success");

  }else{

    const reason=document.getElementById("suggestionReason")?.value||"";

    submitSuggestion(
      id ? "gallery_edit":"gallery_add",
      id,
      obj,
      reason,
      id ? existing:null
    );

    closeModal();

    toast("Cadangan foto dihantar.","success");

  }

}

function deleteGallery(id){

  if(!isAdmin()) return;

  if(!confirm("Padam foto ini?")) return;

  data.gallery=data.gallery.filter(x=>x.id!==id);

  save();

  render();

  toast("Foto dipadam.","success");

}

function compressImage(file,maxWidth=1200,quality=.72){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=e=>{

      const img=new Image();

      img.onload=()=>{

        const ratio=Math.min(
          1,
          maxWidth/img.width
        );

        const canvas=document.createElement("canvas");

        canvas.width=Math.round(img.width*ratio);
        canvas.height=Math.round(img.height*ratio);

        const ctx=canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );

        resolve(
          canvas.toDataURL("image/jpeg",quality)
        );

      };

      img.onerror=reject;

      img.src=e.target.result;

    };

    reader.onerror=reject;

    reader.readAsDataURL(file);

  });

}

function importJSON(e){

  const file=e.target.files[0];

  if(!file) return;

  const reader=new FileReader();

  reader.onload=event=>{

    try{

      const parsed=JSON.parse(event.target.result);

      const incoming=parsed.data || parsed;

      if(!incoming || !Array.isArray(incoming.alumni)){
        throw new Error("Format data tidak sah.");
      }

      if(!confirm(
        "Import akan menggantikan data semasa. Teruskan?"
      )){
        return;
      }

      data=normalize(incoming);

      save();

      render();

      toast("Data berjaya diimport.","success");

    }catch(error){

      console.error(error);

      toast(
        "Import gagal: format JSON tidak sah.",
        "error"
      );

    }finally{

      e.target.value="";

    }

  };

  reader.readAsText(file);

}

function exportCSV(type){

  const rows=data[type] || [];

  if(!rows.length){

    toast("Tiada data untuk diexport.","error");

    return;

  }

  const keys=[...new Set(
    rows.flatMap(row=>Object.keys(row))
  )];

  const csv=[
    keys.map(csvCell).join(","),
    ...rows.map(row=>
      keys.map(key=>csvCell(
        typeof row[key]==="object"
          ? JSON.stringify(row[key])
          : row[key]
      )).join(",")
    )
  ].join("\n");

  downloadFile(
    `kajai-${type}.csv`,
    "\ufeff"+csv,
    "text/csv;charset=utf-8"
  );

  toast(`CSV ${type} berjaya diexport.`,"success");

}

function csvCell(value){

  return `"${String(value??"")
    .replaceAll('"','""')
    .replaceAll("\n"," ")
    .replaceAll("\r"," ")
  }"`;

}

function downloadFile(filename,content,type){

  const blob=new Blob(
    [content],
    {type}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=filename;

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}

  const q=e.target.value.trim();

  if(!q) return;

  window.alumniFilter={
    q,
    batch:"",

    verification:"",
    complete:"",
    sort:"name"
  };

  go("alumni");

}
