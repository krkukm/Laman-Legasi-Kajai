<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laman Legasi Kajai</title>

<style>
:root{
  --navy:#13233f;
  --navy2:#1c3155;
  --gold:#c8a24a;
  --gold2:#e1c778;
  --cream:#f7f4ec;
  --bg:#f4f6fa;
  --card:#ffffff;
  --text:#172033;
  --muted:#6b7280;
  --line:#e5e7eb;
  --green:#16805d;
  --green-bg:#eaf7f1;
  --red:#b83a3a;
  --red-bg:#fff0f0;
  --orange:#b66b00;
  --orange-bg:#fff6e5;
  --blue:#2563eb;
  --blue-bg:#eff6ff;
  --purple:#7652b5;
  --purple-bg:#f5efff;
  --shadow:0 10px 30px rgba(19,35,63,.08);
  --shadow2:0 4px 14px rgba(19,35,63,.06);
  --radius:16px;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100vh;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:270px;
  background:linear-gradient(180deg,var(--navy),#0d1b31);
  color:white;
  z-index:1000;
  overflow-y:auto;
  box-shadow:8px 0 30px rgba(0,0,0,.12);
}

.brand{
  padding:25px 22px 20px;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.brand-title{
  font-size:21px;
  font-weight:800;
  letter-spacing:.3px;
}

.brand-subtitle{
  margin-top:6px;
  color:#cbd5e1;
  font-size:12px;
  line-height:1.5;
}

.heritage-line{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:14px;
  color:var(--gold2);
  font-size:11px;
  font-weight:700;
  letter-spacing:.6px;
}

.heritage-line:before{
  content:"";
  width:28px;
  height:1px;
  background:var(--gold);
}

.nav-section{
  padding:17px 14px 5px;
}

.nav-label{
  padding:0 10px 7px;
  color:#93a4bd;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.3px;
  text-transform:uppercase;
}

.nav-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  border:0;
  background:transparent;
  color:#dbe4f0;
  padding:11px 12px;
  border-radius:10px;
  margin-bottom:3px;
  text-align:left;
  font-size:13px;
  transition:.2s;
}

.nav-item:hover{
  background:rgba(255,255,255,.08);
  color:white;
}

.nav-item.active{
  background:linear-gradient(90deg,rgba(200,162,74,.22),rgba(200,162,74,.08));
  color:white;
  box-shadow:inset 3px 0 0 var(--gold);
}

.nav-icon{
  width:22px;
  text-align:center;
  opacity:.9;
}

.sidebar-bottom{
  margin:20px 14px;
  padding:14px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  background:rgba(255,255,255,.04);
}

.demo-small{
  font-size:11px;
  color:#b9c5d5;
  line-height:1.5;
}

.demo-small strong{
  color:var(--gold2);
}

/* =========================================================
   MAIN
========================================================= */

.main{
  margin-left:270px;
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:900;
  height:72px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 28px;
}

.menu-btn{
  display:none;
  border:0;
  background:var(--navy);
  color:white;
  border-radius:9px;
  width:40px;
  height:40px;
}

.top-search{
  flex:1;
  max-width:480px;
  position:relative;
}

.top-search input{
  width:100%;
  padding:11px 14px 11px 38px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#f8fafc;
  outline:none;
}

.top-search input:focus{
  border-color:var(--gold);
  background:white;
}

.search-icon{
  position:absolute;
  left:13px;
  top:10px;
  color:var(--muted);
}

.top-actions{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

.role-box{
  display:flex;
  align-items:center;
  gap:7px;
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:7px 10px;
}

.role-box span{
  font-size:10px;
  color:var(--muted);
  text-transform:uppercase;
  font-weight:800;
}

.role-box select{
  border:0;
  outline:0;
  background:transparent;
  color:var(--navy);
  font-size:12px;
  font-weight:700;
}

.demo-badge{
  background:var(--orange-bg);
  color:var(--orange);
  border:1px solid #f3d59d;
  padding:7px 10px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
}

/* =========================================================
   CONTENT
========================================================= */

.content{
  padding:30px;
  max-width:1700px;
  margin:auto;
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  margin-bottom:24px;
}

.page-title{
  margin:0;
  font-size:28px;
  letter-spacing:-.6px;
}

.page-subtitle{
  margin:7px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.header-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--line);
  background:white;
  color:var(--text);
  border-radius:10px;
  padding:10px 14px;
  font-weight:700;
  font-size:12px;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadow2);
}

.btn-primary{
  background:var(--navy);
  color:white;
  border-color:var(--navy);
}

.btn-gold{
  background:var(--gold);
  color:white;
  border-color:var(--gold);
}

.btn-danger{
  color:var(--red);
  border-color:#f0caca;
  background:white;
}

.btn-success{
  color:var(--green);
  border-color:#c6e7d9;
  background:white;
}

.btn-small{
  padding:7px 10px;
  font-size:11px;
}

.grid{
  display:grid;
  gap:16px;
}

.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow2);
  padding:20px;
}

.card-title{
  font-size:14px;
  font-weight:800;
  margin:0;
}

.card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:17px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:11px;
}

.stat-card{
  position:relative;
  overflow:hidden;
}

.stat-card:after{
  content:"";
  position:absolute;
  width:80px;
  height:80px;
  right:-25px;
  top:-25px;
  border-radius:50%;
  background:rgba(200,162,74,.08);
}

.stat-icon{
  width:38px;
  height:38px;
  border-radius:10px;
  background:var(--cream);
  color:var(--navy);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  margin-bottom:12px;
}

.stat-number{
  font-size:27px;
  font-weight:800;
  letter-spacing:-.8px;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.stat-foot{
  margin-top:10px;
  font-size:10px;
  color:var(--muted);
}

/* =========================================================
   HERO
========================================================= */

.hero{
  background:
    radial-gradient(circle at 90% 10%,rgba(200,162,74,.22),transparent 30%),
    linear-gradient(135deg,var(--navy),#243d68);
  color:white;
  border-radius:22px;
  padding:30px;
  margin-bottom:18px;
  position:relative;
  overflow:hidden;
}

.hero:after{
  content:"1983";
  position:absolute;
  right:30px;
  bottom:-45px;
  font-size:140px;
  font-weight:900;
  color:rgba(255,255,255,.035);
}

.hero h1{
  margin:0;
  font-size:29px;
  max-width:760px;
}

.hero p{
  color:#d5deeb;
  max-width:700px;
  line-height:1.7;
  font-size:13px;
}

.hero-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:20px;
}

.hero .btn{
  background:white;
  color:var(--navy);
}

.era-line{
  margin-top:25px;
  position:relative;
  height:4px;
  background:rgba(255,255,255,.16);
  border-radius:99px;
}

.era-line:after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:65%;
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
}

.era-labels{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  font-size:10px;
  color:#bdc9da;
}

/* =========================================================
   TABLE
========================================================= */

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:760px;
}

th{
  background:#f8fafc;
  color:#667085;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.5px;
  text-align:left;
  padding:11px 13px;
  border-bottom:1px solid var(--line);
}

td{
  padding:12px 13px;
  border-bottom:1px solid #edf0f4;
  font-size:12px;
  vertical-align:middle;
}

tr:last-child td{
  border-bottom:0;
}

tbody tr:hover{
  background:#fbfcfe;
}

/* =========================================================
   BADGES
========================================================= */

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.badge-green{
  color:var(--green);
  background:var(--green-bg);
}

.badge-red{
  color:var(--red);
  background:var(--red-bg);
}

.badge-orange{
  color:var(--orange);
  background:var(--orange-bg);
}

.badge-blue{
  color:var(--blue);
  background:var(--blue-bg);
}

.badge-purple{
  color:var(--purple);
  background:var(--purple-bg);
}

.badge-gray{
  color:#667085;
  background:#f1f3f5;
}

.action-row{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

/* =========================================================
   FORMS
========================================================= */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.form-grid-3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  font-size:11px;
  font-weight:800;
  color:#374151;
}

.form-group small{
  color:var(--muted);
  font-size:10px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  border:1px solid #dce1e8;
  border-radius:9px;
  padding:10px 11px;
  outline:none;
  background:white;
  color:var(--text);
  font-size:12px;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(200,162,74,.1);
}

.form-divider{
  grid-column:1/-1;
  border-top:1px solid var(--line);
  padding-top:14px;
  margin-top:4px;
  font-size:12px;
  font-weight:800;
  color:var(--navy);
}

.form-actions{
  grid-column:1/-1;
  display:flex;
  justify-content:flex-end;
  gap:8px;
  padding-top:8px;
}

/* =========================================================
   FILTERS
========================================================= */

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

.filters input,
.filters select{
  border:1px solid var(--line);
  background:white;
  border-radius:9px;
  padding:9px 11px;
  outline:none;
  font-size:11px;
  min-width:150px;
}

.filters input:focus,
.filters select:focus{
  border-color:var(--gold);
}

/* =========================================================
   PROGRESS
========================================================= */

.progress{
  height:7px;
  background:#edf0f4;
  border-radius:99px;
  overflow:hidden;
}

.progress > span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--navy),var(--gold));
  border-radius:inherit;
}

.progress-row{
  margin-bottom:15px;
}

.progress-meta{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  margin-bottom:6px;
}

/* =========================================================
   BATCH CARDS
========================================================= */

.batch-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(165px,1fr));
  gap:11px;
}

.batch-card{
  background:white;
  border:1px solid var(--line);
  border-radius:13px;
  padding:15px;
  cursor:pointer;
  transition:.2s;
  position:relative;
  overflow:hidden;
}

.batch-card:hover{
  border-color:var(--gold);
  transform:translateY(-2px);
  box-shadow:var(--shadow2);
}

.batch-year{
  font-size:23px;
  font-weight:900;
  color:var(--navy);
}

.batch-count{
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
}

.batch-mini{
  margin-top:12px;
}

.batch-rep{
  font-size:10px;
  color:#475467;
  margin-top:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-head{
  display:flex;
  gap:18px;
  align-items:center;
}

.avatar{
  width:70px;
  height:70px;
  border-radius:16px;
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:900;
  overflow:hidden;
  flex:none;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-size:22px;
  font-weight:900;
}

.profile-meta{
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}

.detail-item{
  background:#f8fafc;
  border-radius:10px;
  padding:11px;
}

.detail-label{
  font-size:9px;
  text-transform:uppercase;
  color:#7a8494;
  font-weight:800;
  letter-spacing:.5px;
}

.detail-value{
  font-size:12px;
  margin-top:5px;
  line-height:1.5;
  word-break:break-word;
}

/* =========================================================
   TIMELINE
========================================================= */

.timeline{
  position:relative;
  margin-left:10px;
  padding-left:25px;
}

.timeline:before{
  content:"";
  position:absolute;
  left:6px;
  top:5px;
  bottom:5px;
  width:2px;
  background:#dce2ea;
}

.timeline-item{
  position:relative;
  padding-bottom:20px;
}

.timeline-dot{
  position:absolute;
  left:-25px;
  top:2px;
  width:13px;
  height:13px;
  border-radius:50%;
  background:var(--gold);
  border:3px solid var(--cream);
  box-shadow:0 0 0 1px var(--gold);
}

.timeline-year{
  font-size:11px;
  color:var(--gold);
  font-weight:900;
}

.timeline-title{
  font-size:13px;
  font-weight:800;
  margin-top:3px;
}

.timeline-text{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:28px;
  margin-bottom:10px;
}

.empty-title{
  font-weight:800;
  color:#374151;
}

.empty-text{
  font-size:11px;
  margin-top:5px;
}

/* =========================================================
   MODAL
========================================================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(8,18,34,.62);
  z-index:2000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal{
  width:min(900px,100%);
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:18px;
  box-shadow:0 30px 70px rgba(0,0,0,.3);
}

.modal.large{
  width:min(1150px,100%);
}

.modal-head{
  position:sticky;
  top:0;
  z-index:2;
  background:white;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
  padding:20px 22px;
  border-bottom:1px solid var(--line);
}

.modal-title{
  font-size:17px;
  font-weight:900;
}

.modal-subtitle{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.modal-close{
  border:0;
  background:#f3f4f6;
  border-radius:9px;
  width:34px;
  height:34px;
  color:#475467;
}

.modal-body{
  padding:22px;
}

/* =========================================================
   TOAST
========================================================= */

.toast-container{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:5000;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.toast{
  min-width:260px;
  max-width:400px;
  background:var(--navy);
  color:white;
  padding:13px 15px;
  border-radius:11px;
  box-shadow:var(--shadow);
  font-size:11px;
  animation:toastIn .25s ease;
}

.toast.success{
  background:#17664f;
}

.toast.error{
  background:#9d3030;
}

@keyframes toastIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}

/* =========================================================
   GALLERY
========================================================= */

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:12px;
}

.gallery-card{
  background:white;
  border:1px solid var(--line);
  border-radius:13px;
  overflow:hidden;
}

.gallery-img{
  height:150px;
  background:#edf1f5;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.gallery-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.gallery-no-image{
  color:#9aa4b2;
  font-size:25px;
}

.gallery-info{
  padding:11px;
}

.gallery-caption{
  font-size:12px;
  font-weight:800;
}

.gallery-meta{
  margin-top:5px;
  font-size:10px;
  color:var(--muted);
}

/* =========================================================
   DASHBOARD SPECIAL
========================================================= */

.quick-actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.quick-action{
  border:1px dashed #d8dde5;
  background:#fbfcfe;
  border-radius:11px;
  padding:12px;
  text-align:left;
  cursor:pointer;
}

.quick-action:hover{
  border-color:var(--gold);
  background:white;
}

.quick-action strong{
  display:block;
  font-size:11px;
  margin-bottom:4px;
}

.quick-action span{
  color:var(--muted);
  font-size:9px;
}

.coverage-number{
  font-size:35px;
  font-weight:900;
  color:var(--navy);
}

.metric-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.metric{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #edf0f4;

<script>
/* =========================================================
   LAMAN LEGASI KAJAI
   Unified Laman Legasi + KARISMA
   Pure HTML + CSS + Vanilla JavaScript
========================================================= */


/* =========================================================
   CONSTANTS
========================================================= */

const STORAGE_KEY = "laman_legasi_kajai_unified_v1";
const ROLE_KEY = "laman_legasi_kajai_role";

const DEFAULT_UNITS = [

];

  "Voice of Kajai (VOK)",

  "Event & Art Management Club (E-MAC)",
  "ADIWANGSA Kajai"
];

const DEFAULT_SCORES = [
  ["Hebahan media sosial sahaja",2],
  ["Pemberi pandangan",2],
  ["Peserta / penyokong",3],
  ["Moderator / emcee / pembaca doa",7],
  ["Juri",7],
  ["Mentor",7],
  ["Bantu jaringan",8],
  ["Penaja barang in-kind <50 unit",10],
  ["Penaja <RM100",10],
  ["Penasihat bersama rasmi program",12],
  ["Rakan strategik program",12],
  ["Penaja barang in-kind 50–100 unit",15],
  ["Penaja RM100–RM300",15],
  ["Panel forum / penceramah",20],
  ["Koreografer / pengajar kemahiran",20],
  ["Penaja barang in-kind >100 unit",20],
  ["Jawatankuasa perancangan program",20],
  ["Penaja RM300–RM500",20],
  ["Penaja RM500–RM1000",25],
  ["Terlibat dari awal reka bentuk program",25],
  ["Penaja >RM1000",30]
];

const DEFAULT_BONUSES = [
  ["Membawa penglibatan industri luar",10],
  ["Penglibatan luar kawasan/negeri",10],
  ["Membuka peluang internship/pekerjaan",15],
  ["Alumni hadir dari luar negara",20]
];

const DEFAULT_PENALTIES = [
  ["Bukti tidak lengkap / token evidence",5],
  ["Jemputan dibuat tetapi tiada susulan",5],
  ["Gagal menghantar laporan",10],
  ["Tiada usaha mendapatkan alumni",20]
];

const JOB_FIELDS = [
  "Pendidikan",
  "Kejuruteraan",
  "Sains & Teknologi",
  "Alam Sekitar & Kelestarian",
  "Kesihatan",
  "Kerajaan & Perkhidmatan Awam",
  "Korporat",
  "Kewangan",
  "Keusahawanan",
  "Media & Komunikasi",
  "IT & Digital",
  "Penyelidikan",
  "Undang-undang",
  "Seni & Kreatif",
  "Lain-lain"
];

const ACTIVITY_CATEGORIES = [
  "Program KRK",
  "MEP",
  "JAKSA",
  "Biro",
  "Kelab",
  "Akademik",
  "Sukan",
  "Kebajikan",
  "Jaringan Alumni",
  "Lain-lain"
];

const LEADERSHIP_CATEGORIES = [
  "Pentadbiran Kolej",
  "Kepimpinan Pelajar",
  "Biro",
  "Kelab / Persatuan",
  "Lain-lain"
];


/* =========================================================
   STATE
========================================================= */

let currentPage = "dashboard";
let currentRole = sessionStorage.getItem(ROLE_KEY) || "Pentadbir";

let data = loadData();


/* =========================================================
   DATA NORMALISATION
========================================================= */

function uid(prefix="id"){
  return prefix + "_" + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
}

function now(){
  return new Date().toISOString();
}

function defaultData(){

  const batches = [];

  for(let year=1983; year<=2026; year++){
    batches.push({
      id:uid("batch"),
      year,
      notes:"",
      active:true
    });
  }

  return {
    version:1,

    config:{
      name:"LAMAN LEGASI KAJAI",
      subtitle:"KARISMA • Alumni • Sejarah • Jaringan",
      welcome:"Menghimpun Nama. Menyusun Sejarah. Menjaga Legasi.",
      currentYear:2026,
      privacyDefault:"Dalaman Sahaja"
    },

    batches,

    alumni:[],

    leadership:[],

    reps:[],

    units:[
      ...DEFAULT_UNITS.map(name=>({
        id:uid("unit"),
        type:"Biro",
        name
      })),
      ...DEFAULT_CLUBS.map(name=>({
        id:uid("unit"),
        type:"Kelab",
        name
      }))
    ],

    scores:DEFAULT_SCORES.map(x=>({
      id:uid("score"),
      name:x[0],
      points:x[1]
    })),

    bonuses:DEFAULT_BONUSES.map(x=>({
      id:uid("bonus"),
      name:x[0],
      points:x[1]
    })),

    penalties:DEFAULT_PENALTIES.map(x=>({
      id:uid("pen"),
      name:x[0],
      points:x[1]
    })),

    records:[],

    activities:[],

    achievements:[],

    gallery:[],

    suggestions:[],

    audit:[]
  };
}

function normalize(d){

  const base = defaultData();

  if(!d || typeof d!=="object") return base;

  const result = {...base,...d};

  result.config = {...base.config,...(d.config||{})};

  const arrays = [
    "batches",
    "alumni",
    "leadership",
    "reps",
    "units",
    "scores",
    "bonuses",
    "penalties",
    "records",
    "activities",
    "achievements",
    "gallery",
    "suggestions",
    "audit"
  ];

  arrays.forEach(k=>{
    if(!Array.isArray(result[k])) result[k]=[];
  });

  return result;
}

function loadData(){

  try{

    const raw = localStorage.getItem(STORAGE_KEY);

    if(raw){
      return normalize(JSON.parse(raw));
    }

    /* migration from old KARISMA */
    const old = localStorage.getItem("karisma_kajai_data");

    if(old){

      const oldData = JSON.parse(old);
      const fresh = normalize(oldData);

      return fresh;
    }

  }catch(error){

    console.error(error);

  }

  return defaultData();
}

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* =========================================================
   UTILITIES
========================================================= */

function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function money(n){

  return "RM " + Number(n||0).toLocaleString("ms-MY",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

}

function dateMY(value){

  if(!value) return "-";

  const d = new Date(value);

  if(Number.isNaN(d.getTime())) return value;

  return d.toLocaleDateString("ms-MY",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });

}

function yearList(){

  const years = data.batches
    .map(b=>Number(b.year))
    .filter(Boolean)
    .sort((a,b)=>a-b);

  return years;
}

function allUnits(){

  return data.units;
}

function getAlumni(id){

  return data.alumni.find(a=>a.id===id);
}

function getUnit(id){

  return data.units.find(u=>u.id===id);
}

function getBatch(year){

  return data.batches.find(b=>Number(b.year)===Number(year));
}

function initials(name){

  return String(name||"?")
    .split(/\s+/)
    .filter(Boolean)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();

}

function statusBadge(status){

  const map = {
    "Disahkan":"badge-green",
    "Diluluskan":"badge-green",
    "Lulus":"badge-green",
    "Menunggu":"badge-orange",
    "Belum disahkan":"badge-gray",
    "Perlu semakan":"badge-orange",
    "Ditolak":"badge-red",
    "Tidak lulus":"badge-red",
    "Aktif":"badge-blue",
    "Tidak aktif":"badge-gray"
  };

  return `<span class="badge ${map[status]||"badge-gray"}">${esc(status||"-")}</span>`;

}

function verificationBadge(status){

  return statusBadge(status || "Belum disahkan");

}

function isAdmin(){

  return currentRole==="Pentadbir";

}

function toast(message,type=""){

  const container = document.getElementById("toastContainer");

  const item = document.createElement("div");

  item.className = "toast " + type;

  item.textContent = message;

  container.appendChild(item);

  setTimeout(()=>{
    item.remove();
  },3500);

}

function audit(action,type,id=""){

  data.audit.unshift({
    id:uid("audit"),
    action,
    type,
    targetId:id,
    role:currentRole,
    at:now()
  });

  data.audit=data.audit.slice(0,300);

}

function approvedRecords(){

  return data.records.filter(r=>r.status==="Diluluskan" || r.status==="Diluluskan");
}


/* =========================================================
   ROLE
========================================================= */

function setRole(role){

  currentRole = role;

  sessionStorage.setItem(ROLE_KEY,role);

  renderNav();

  render();

  toast(
    role==="Pentadbir"
      ? "Mod Pentadbir aktif."
      : "Mod Pasukan aktif. Perubahan akan dihantar sebagai cadangan.",
    role==="Pentadbir" ? "success" : ""
  );

}

function renderNav(){

  document.querySelectorAll(".admin-only").forEach(el=>{
    el.classList.toggle("hidden",!isAdmin());
  });

  document.querySelectorAll(".nav-item").forEach(el=>{
    el.classList.toggle(
      "active",
      el.dataset.page===currentPage
    );
  });

  document.getElementById("roleSelect").value=currentRole;

}


/* =========================================================
   NAVIGATION
========================================================= */

function go(page){

  if(!isAdmin() && ["merit","units","settings","data"].includes(page)){
    toast("Halaman ini memerlukan mod Pentadbir.","error");
    return;
  }

  currentPage=page;

  renderNav();

  render();

  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarOverlay").classList.remove("open");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function toggleSidebar(){

  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sidebarOverlay").classList.toggle("open");

}


/* =========================================================
   MODAL
========================================================= */

function openModal(title,body,subtitle="",large=false){

  const modal=document.getElementById("modalBox");

  modal.classList.toggle("large",large);

  document.getElementById("modalTitle").innerHTML=title;
  document.getElementById("modalSubtitle").innerHTML=subtitle;
  document.getElementById("modalBody").innerHTML=body;

  document.getElementById("modalBackdrop").classList.remove("hidden");

}

function closeModal(){

  document.getElementById("modalBackdrop").classList.add("hidden");

}

function backdropClose(e){

  if(e.target.id==="modalBackdrop"){
    closeModal();
  }

}


/* =========================================================
   COMPLETENESS
========================================================= */

const IMPORTANT_FIELDS = [
  ["fullName","Nama penuh"],
  ["batch","Batch"],
  ["course","Kursus"],
  ["phone","No. telefon"],
  ["email","E-mel"],
  ["jobTitle","Jawatan pekerjaan"],
  ["employer","Organisasi / majikan"],
  ["jobField","Bidang pekerjaan"],
  ["kajaiRoles","Jawatan / penglibatan di Kajai"],
  ["currentLocation","Lokasi semasa"],
  ["motto","Moto hidup"]
];

function completeness(alumni){

  if(!alumni) return 0;

  const filled = IMPORTANT_FIELDS.filter(([key])=>{
    return String(alumni[key]||"").trim()!=="";
  }).length;

  return Math.round(
    (filled / IMPORTANT_FIELDS.length) * 100
  );

}

function completenessLabel(pct){

  if(pct>=80){
    return `<span class="badge badge-green">Lengkap ${pct}%</span>`;
  }

  if(pct>=50){
    return `<span class="badge badge-orange">Hampir Lengkap ${pct}%</span>`;
  }

  return `<span class="badge badge-red">Perlu Dilengkapkan ${pct}%</span>`;

}

function missingFields(alumni){

  return IMPORTANT_FIELDS
    .filter(([key])=>!String(alumni?.[key]||"").trim())
    .map(x=>x[1]);

}


/* =========================================================
   MERIT
========================================================= */

function scoreOf(id){

  return data.scores.find(x=>x.id===id);

}

function merit(record){

  const base = Number(record.basePoints||0);
  const bonus = Number(record.bonusPoints||0);
  const penalty = Number(record.penaltyPoints||0);
  const scale = Number(record.scale||1);

  return Math.max(
    0,
    (base + bonus - penalty) * scale
  );

}

function unitMerit(unitId){

  return approvedRecords()
    .filter(r=>r.unitId===unitId)
    .reduce((sum,r)=>sum+merit(r),0);

}

function totalMerit(){

  return approvedRecords()
    .reduce((sum,r)=>sum+merit(r),0);

}


/* =========================================================
   PRIVACY
========================================================= */

function privateField(value,visibility){

  if(!value) return "-";

  if(visibility==="Boleh Dipaparkan"){
    return esc(value);
  }

  if(isAdmin() && visibility==="Dalaman Sahaja"){
    return esc(value);
  }

  if(visibility==="Pasukan Sahaja" && currentRole==="Pasukan"){
    return esc(value);
  }

  return `<span class="muted">Disembunyikan</span>`;

}


/* =========================================================
   RENDER ROOT
========================================================= */

function render(){

  document.getElementById("brandSubtitle").textContent =
    data.config.subtitle;

  const pages = {
    dashboard:pageDashboard,
    timeline:pageTimeline,
    alumni:pageAlumni,
    leadership:pageLeadership,
    reps:pageReps,
    records:pageRecords,
    merit:pageMerit,
    units:pageUnits,
    activities:pageActivities,
    achievements:pageAchievements,
    suggestions:pageSuggestions,
    gallery:pageGallery,
    reports:pageReports,
    settings:pageSettings,
    data:pageData
  };

  const fn=pages[currentPage] || pageDashboard;

  document.getElementById("content").innerHTML=fn();

}


/* =========================================================
   DASHBOARD
========================================================= */

function pageDashboard(){

  const alumniCount=data.alumni.length;
  const batchCount=data.batches.filter(b=>b.active!==false).length;
  const repsCount=data.reps.length;
  const pending=data.suggestions.filter(s=>s.status==="Menunggu").length;
  const approvedCount=approvedRecords().length;
  const total=totalMerit();

  const completenessAvg = alumniCount
    ? Math.round(
        data.alumni.reduce((sum,a)=>sum+completeness(a),0)/alumniCount
      )
    : 0;

  const activeUnits=data.units.length;

  const recent=[
    ...data.audit
  ].sort((a,b)=>new Date(b.at)-new Date(a.at))
   .slice(0,6);

  const batchStats=data.batches
    .filter(b=>b.active!==false)
    .map(b=>{
      const list=data.alumni.filter(a=>Number(a.batch)===Number(b.year));
      const pct=list.length
        ? Math.round(list.reduce((s,a)=>s+completeness(a),0)/list.length)
        : 0;
      return {...b,count:list.length,pct};
    })
    .filter(x=>x.count>0)
    .sort((a,b)=>b.count-a.count)
    .slice(0,6);

  return `

    <div class="hero">
      <h1>${esc(data.config.welcome)}</h1>
      <p>

    <div class="grid grid-2">

      <div class="card">

        <div class="card-head">
          <div>
            <div class="card-title">Aktiviti Terkini</div>
            <div class="small muted">Log perubahan sistem</div>

          ?
          `<div class="timeline">
            ${recent.map(x=>`
              <div class="timeline-item">
                <div class="timeline-dot"></div>
                <div class="timeline-year">${dateMY(x.at)}</div>
                <div class="timeline-title">${esc(x.action)}</div>

            <div class="small muted">Alumni dengan kelengkapan terendah</div>

          </button>
        </div>

        ${
          data.alumni.length
          ?
          data.alumni
            .map(a=>({...a,pct:completeness(a)}))
            .sort((a,b)=>a.pct-b.pct)
            .slice(0,7)
            .map(a=>`
              <div class="metric">
                <div>
                  <div class="metric-name">${esc(a.fullName)}</div>
                  <div class="small muted">Batch ${esc(a.batch)}</div>
                </div>
                <div>${completenessLabel(a.pct)}</div>
              </div>
            `).join("")
          :
          empty("♙","Belum ada alumni","Tambah rekod alumni pertama.")
        }

      </div>

    </div>
  `;

}

function statCard(icon,value,label,foot){

  return `
    <div class="card stat-card">
      <div class="stat-icon">${icon}</div>
      <div class="stat-number">${value}</div>
      <div class="stat-label">${esc(label)}</div>
      <div class="stat-foot">${esc(foot)}</div>
    </div>
  `;

}

function quickAction(icon,title,text,onclick){

  return `
    <div class="quick-action" onclick="${onclick}">
      <strong>${icon} ${esc(title)}</strong>
      <span>${esc(text)}</span>
    </div>
  `;

}

function empty(icon,title,text){

  return `
    <div class="empty">
      <div class="empty-icon">${icon}</div>
      <div class="empty-title">${esc(title)}</div>
      <div class="empty-text">${esc(text)}</div>
    </div>
  `;

}

function pageTimeline(){

  const years=yearList();

  return `

    <div class="page-header">

      <div>
        <h1 class="page-title">Peta Legasi Kajai</h1>
        <p class="page-subtitle">
          Jejak batch, alumni dan perkembangan sejarah Kajai dari 1983 hingga kini.
        </p>
      </div>

      <div class="header-actions">
        ${
          isAdmin()
          ?
          `<button class="btn btn-primary" onclick="openBatchForm()">
            + Tambah Tahun / Batch
          </button>`
          :""
        }
      </div>

    </div>


    <div class="grid grid-4">

      ${statCard("◈",years.length,"Tahun / Batch","Dalam pangkalan data")}

      ${statCard("♙",data.alumni.length,"Alumni","Semua batch")}

      ${statCard("♛",data.leadership.length,"Rekod Kepimpinan","Sejarah kepimpinan")}

      ${statCard("◎",data.reps.length,"Wakil Batch","Semua status")}

    </div>


    <div style="height:16px"></div>


    <div class="card">

      <div class="card-head">

        <div>
          <div class="card-title">Timeline 1983 → ${data.config.currentYear}</div>
          <div class="small muted">
            Klik mana-mana tahun untuk melihat data batch.
          </div>
        </div>

        <input
          id="timelineSearch"
          placeholder="Cari tahun..."
          oninput="filterTimeline()"
          style="padding:9px;border:1px solid var(--line);border-radius:9px;width:150px"
        >

      </div>

      <div class="batch-grid" id="batchGrid">

        ${years.map(year=>batchCard(year)).join("")}

      </div>

    </div>

  `;

}

function batchCard(year){

  const alumni=data.alumni.filter(a=>Number(a.batch)===Number(year));

  const reps=data.reps.filter(r=>Number(r.batch)===Number(year));

  const pct=alumni.length
    ? Math.round(alumni.reduce((s,a)=>s+completeness(a),0)/alumni.length)
    : 0;

  return `
    <div
      class="batch-card"
      data-year="${year}"
      onclick="openBatchDetail(${year})"
    >

      <div class="batch-year">${year}</div>

      <div class="batch-count">
        ${alumni.length} alumni
      </div>

      <div class="batch-mini">
        <div class="progress">
          <span style="width:${pct}%"></span>
        </div>
      </div>

      <div class="batch-count">
        ${pct}% kelengkapan
      </div>

      <div class="batch-rep">
        ${reps.length
          ? "Wakil: "+reps.map(r=>esc(r.name)).join(", ")
          : "Wakil belum direkod"}
      </div>

    </div>
  `;

}

function filterTimeline(){

  const q=document.getElementById("timelineSearch").value.toLowerCase();

  document.querySelectorAll(".batch-card").forEach(card=>{
    card.style.display =
      card.dataset.year.includes(q)
      ? ""
      : "none";
  });

}

function openBatchDetail(year){

  const alumni=data.alumni.filter(a=>Number(a.batch)===Number(year));

  const reps=data.reps.filter(r=>Number(r.batch)===Number(year));

  const leaders=data.leadership.filter(l=>{
    const from=Number(l.yearFrom);
    const to=Number(l.yearTo||l.yearFrom);
    return year>=from && year<=to;
  });

  openModal(
    `Batch ${year}`,
    `
      <div class="grid grid-3">

        <div class="card">
          <div class="stat-number">${alumni.length}</div>
          <div class="stat-label">Alumni</div>
        </div>

        <div class="card">
          <div class="stat-number">${reps.length}</div>
          <div class="stat-label">Wakil Batch</div>
        </div>

        <div class="card">
          <div class="stat-number">${leaders.length}</div>
          <div class="stat-label">Rekod Kepimpinan</div>
        </div>

      </div>

      <div style="height:15px"></div>

      <div class="card">

        <div class="card-head">
          <div class="card-title">Wakil Batch</div>
        </div>

        ${
          reps.length
          ?
          `<div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Nama</th>
                  <th>Status</th>
                  <th>Tahun Dilantik</th>
                </tr>
              </thead>
              <tbody>
                ${reps.map(r=>`
                  <tr>
                    <td><strong>${esc(r.name)}</strong></td>
                    <td>${statusBadge(r.status)}</td>
                    <td>${esc(r.appointedYear||"-")}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>`
          :
          empty("◎","Belum ada wakil","")
        }

      </div>

      <div style="height:15px"></div>

      <div class="card">

        <div class="card-head">
          <div class="card-title">Alumni Batch ${year}</div>
        </div>

        ${
          alumni.length
          ?
          `<div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Nama</th>
                  <th>Kursus</th>
                  <th>Pekerjaan</th>
                  <th>Kelengkapan</th>
                </tr>
              </thead>
              <tbody>
                ${alumni.map(a=>`
                  <tr>
                    <td>
                      <button class="btn btn-small" onclick="closeModal();openAlumniDetail('${a.id}')">
                        ${esc(a.fullName)}
                      </button>
                    </td>
                    <td>${esc(a.course||"-")}</td>
                    <td>${esc(a.jobTitle||"-")}</td>
                    <td>${completenessLabel(completeness(a))}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>`
          :
          empty("♙","Belum ada alumni","")
        }

      </div>

      <div style="height:15px"></div>

      <div class="card">

        <div class="card-head">
          <div class="card-title">Kepimpinan Pada Era Ini</div>
        </div>

        ${
          leaders.length
          ?
          `<div class="timeline">
            ${leaders.map(l=>`
              <div class="timeline-item">
                <div class="timeline-dot"></div>
                <div class="timeline-year">
                  ${esc(l.yearFrom)}${l.yearTo ? "–"+esc(l.yearTo):""}
                </div>
                <div class="timeline-title">
                  ${esc(l.position)} — ${esc(l.name)}
                </div>
                <div class="timeline-text">
                  ${esc(l.category||"")}
                </div>
              </div>
            `).join("")}
          </div>`
          :
          empty("♛","Belum ada rekod kepimpinan","")
        }

      </div>
    `,
    "Ringkasan sejarah batch",
    true
  );

}


/* =========================================================
   ALUMNI PAGE
========================================================= */

function pageAlumni(){

  const q=window.alumniFilter?.q || "";
  const batch=window.alumniFilter?.batch || "";
  const field=window.alumniFilter?.field || "";
  const verification=window.alumniFilter?.verification || "";
  const completenessFilter=window.alumniFilter?.complete || "";
  const sort=window.alumniFilter?.sort || "name";

  let list=[...data.alumni];

  list=list.filter(a=>{

    const text=[
      a.fullName,
      a.nickname,
      a.email,
      a.phone,
      a.course,
      a.faculty,
      a.employer,
      a.jobTitle,
      a.jobField,
      a.kajaiRoles
    ].join(" ").toLowerCase();

    const matchQ=!q || text.includes(q.toLowerCase());

    const matchBatch=!batch || String(a.batch)===String(batch);

    const matchField=!field || a.jobField===field;

    const matchVerification=!verification || a.verification===verification;

    const pct=completeness(a);

    const matchComplete=
      !completenessFilter ||
      (completenessFilter==="complete" && pct>=80) ||
      (completenessFilter==="almost" && pct>=50 && pct<80) ||
      (completenessFilter==="low" && pct<50);

    return matchQ && matchBatch && matchField && matchVerification && matchComplete;

  });

  if(sort==="name"){
    list.sort((a,b)=>a.fullName.localeCompare(b.fullName));
  }

  if(sort==="batch"){
    list.sort((a,b)=>Number(b.batch)-Number(a.batch));
  }

  if(sort==="updated"){
    list.sort((a,b)=>new Date(b.updatedAt||0)-new Date(a.updatedAt||0));
  }

  return `

    <div class="page-header">

      <div>
        <h1 class="page-title">Direktori Alumni</h1>
        <p class="page-subtitle">
          Pangkalan data alumni Kajai dengan profil legasi, kerjaya,
          penglibatan dan maklumat hubungan.
        </p>
      </div>

      <div class="header-actions">
        <button class="btn btn-primary" onclick="openAlumniForm()">
          + ${isAdmin() ? "Tambah Alumni" : "Cadangkan Alumni"}
        </button>
      </div>

    </div>


    <div class="card">

      <div class="filters">

        <input
          id="alumniQ"
          placeholder="Cari nama, kursus, organisasi..."
          value="${esc(q)}"
          oninput="applyAlumniFilters()"
        >

        <select id="alumniBatch" onchange="applyAlumniFilters()">
          <option value="">Semua batch</option>
          ${yearList().map(y=>`
            <option value="${y}" ${String(batch)===String(y)?"selected":""}>
              ${y}
            </option>
          `).join("")}
        </select>

        <select id="alumniField" onchange="applyAlumniFilters()">
          <option value="">Semua bidang pekerjaan</option>
          ${JOB_FIELDS.map(x=>`
            <option ${field===x?"selected":""}>${esc(x)}</option>
          `).join("")}
        </select>

        <select id="alumniVerification" onchange="applyAlumniFilters()">
          <option value="">Semua status</option>
          <option ${verification==="Disahkan"?"selected":""}>Disahkan</option>
          <option ${verification==="Belum disahkan"?"selected":""}>Belum disahkan</option>
          <option ${verification==="Perlu semakan"?"selected":""}>Perlu semakan</option>
        </select>

        <select id="alumniComplete" onchange="applyAlumniFilters()">
          <option value="">Semua kelengkapan</option>
          <option value="complete" ${completenessFilter==="complete"?"selected":""}>
            Lengkap
          </option>
          <option value="almost" ${completenessFilter==="almost"?"selected":""}>
            Hampir lengkap
          </option>
          <option value="low" ${completenessFilter==="low"?"selected":""}>
            Perlu dilengkapkan
          </option>
        </select>

        <select id="alumniSort" onchange="applyAlumniFilters()">
          <option value="name" ${sort==="name"?"selected":""}>Nama A–Z</option>
          <option value="batch" ${sort==="batch"?"selected":""}>Batch terbaru</option>
          <option value="updated" ${sort==="updated"?"selected":""}>Kemaskini terbaru</option>
        </select>

      </div>


      <div class="card-head">

        <div>
          <div class="card-title">${list.length} rekod alumni</div>
          <div class="small muted">
            Klik nama untuk melihat profil penuh.
          </div>
        </div>

      </div>


      ${
        list.length
        ?
        `<div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Alumni</th>
                <th>Batch</th>
                <th>Kursus / Fakulti</th>
                <th>Kerjaya</th>
                <th>Kelengkapan</th>
                <th>Status</th>
                <th>Tindakan</th>
              </tr>
            </thead>

            <tbody>

              ${list.map(a=>`

                <tr>

                  <td>
                    <div style="display:flex;align-items:center;gap:9px">
                      <div class="avatar" style="width:38px;height:38px;border-radius:10px;font-size:13px">
                        ${
                          a.photo
                          ? `<img src="${a.photo}" alt="">`
                          : initials(a.fullName)
                        }
                      </div>

                      <div>
                        <strong>${esc(a.fullName)}</strong>
                        ${
                          a.nickname
                          ? `<div class="small muted">“${esc(a.nickname)}”</div>`
                          :""
                        }
                      </div>
                    </div>
                  </td>

                  <td>
                    <strong>${esc(a.batch)}</strong>
                  </td>

                  <td>
                    ${esc(a.course||"-")}
                    <div class="small muted">${esc(a.faculty||"")}</div>
                  </td>

                  <td>
                    ${esc(a.jobTitle||"-")}
                    <div class="small muted">${esc(a.employer||"")}</div>
                  </td>

                  <td>
                    ${completenessLabel(completeness(a))}
                  </td>

                  <td>
                    ${verificationBadge(a.verification)}
                  </td>

                  <td>
                    <div class="action-row">
                      <button class="btn btn-small" onclick="openAlumniDetail('${a.id}')">
                        Lihat
                      </button>

                      <button class="btn btn-small" onclick="openAlumniForm('${a.id}')">
                        ${isAdmin() ? "Edit" : "Cadang Edit"}
                      </button>

                      ${
                        isAdmin()
                        ?
                        `<button class="btn btn-small btn-danger" onclick="deleteAlumni('${a.id}')">
                          Padam
                        </button>`
                        :""
                      }
                    </div>
                  </td>

                </tr>

              `).join("")}

            </tbody>
          </table>
        </div>`
        :
        empty("♙","Tiada alumni dijumpai","Cuba ubah kata carian atau tambah rekod baru.")
      }

    </div>

  `;

}

function applyAlumniFilters(){

  window.alumniFilter={
    q:document.getElementById("alumniQ").value,
    batch:document.getElementById("alumniBatch").value,
    field:document.getElementById("alumniField").value,
    verification:document.getElementById("alumniVerification").value,
    complete:document.getElementById("alumniComplete").value,
    sort:document.getElementById("alumniSort").value
  };

  render();

}

  const a=getAlumni(id);

  if(!a) return;

  const acts=data.activities.filter(x=>x.alumniId===id);
  const ach=data.achievements.filter(x=>x.alumniId===id);
  const leaders=data.leadership.filter(x=>
    x.alumniId===id ||
    String(x.name).toLowerCase()===String(a.fullName).toLowerCase()
  );

  openModal(
    esc(a.fullName),
    `

      <div class="profile-head">

        <div class="avatar">
          ${
            a.photo
            ? `<img src="${a.photo}" alt="">`
            : initials(a.fullName)
          }
        </div>

        <div>

          <div class="profile-name">${esc(a.fullName)}</div>

          <div class="profile-meta">
            ${
              a.nickname
              ? `“${esc(a.nickname)}” · `
              :""
            }
            Batch ${esc(a.batch)}
          </div>

          <div style="margin-top:8px">
            ${verificationBadge(a.verification)}
            ${completenessLabel(completeness(a))}
          </div>

        </div>

      </div>


      <div style="height:18px"></div>


      <div class="card">

        <div class="card-head">
          <div class="card-title">Maklumat Akademik & Kerjaya</div>
        </div>

        <div class="detail-grid">

          ${detail("Tahun Masuk",a.entryYear)}
          ${detail("Tahun Tamat",a.gradYear)}
          ${detail("Fakulti",a.faculty)}
          ${detail("Kursus",a.course)}
          ${detail("Jawatan Terkini",a.jobTitle)}
          ${detail("Organisasi / Majikan",a.employer)}
          ${detail("Bidang Pekerjaan",a.jobField)}
          ${detail("Lokasi Semasa",a.currentLocation)}
          ${detail("Negara",a.country)}
          ${detail("Pengalaman",a.experienceYears ? a.experienceYears+" tahun" : "")}
          ${detail("Tahun Mula Kerjaya",a.careerStartYear)}
          ${detail("LinkedIn / Profesional",a.linkedin)}

        </div>

      </div>


      <div style="height:14px"></div>

function selectField(label,name,options,value="",required=false){

          return `

              value="${esc(val)}"
              ${String(value)===String(val)?"selected":""}

async function submitAlumniForm(e,id){

  e.preventDefault();

  const form=e.target;

  const fd=new FormData(form);

  const obj=Object.fromEntries(fd.entries());

  const file=document.getElementById("alumniPhoto");

  let photo="";

  if(file && file.files[0]){
    photo=await compressImage(file.files[0]);
  }

  const existing=id ? getAlumni(id) : null;

  const newObj={
    ...obj,
    batch:Number(obj.batch),
    entryYear:obj.entryYear ? Number(obj.entryYear):"",
    gradYear:obj.gradYear ? Number(obj.gradYear):"",
    careerStartYear:obj.careerStartYear ? Number(obj.careerStartYear):"",
    experienceYears:obj.experienceYears ? Number(obj.experienceYears):"",
    updatedAt:now(),
    photo:photo || existing?.photo || ""
  };

  if(isAdmin()){

    if(existing){

      Object.assign(existing,newObj);

      audit("Mengemas kini profil alumni","Alumni",existing.id);

      toast("Profil alumni berjaya dikemas kini.","success");

    }else{

      newObj.id=uid("alumni");
      newObj.createdAt=now();

      data.alumni.push(newObj);

      audit("Menambah alumni","Alumni",newObj.id);

      toast("Alumni berjaya ditambah.","success");

    }

    ensureBatch(Number(newObj.batch));

    save();
    closeModal();
    render();

  }else{

    const reason=document.getElementById("suggestionReason")?.value || "";

    submitSuggestion(
      existing ? "alumni_edit":"alumni_add",
      existing?.id || "",
      existing ? newObj : newObj,
      reason,
      existing ? existing : null
    );

    closeModal();

    toast("Cadangan dihantar kepada Pentadbir.","success");

  }

}

function deleteAlumni(id){

  if(!isAdmin()) return;

  const a=getAlumni(id);

  if(!a) return;

  if(!confirm(`Padam rekod alumni "${a.fullName}"?`)) return;

  data.alumni=data.alumni.filter(x=>x.id!==id);

  audit("Memadam alumni","Alumni",id);

  save();

  toast("Rekod alumni dipadam.","success");

  render();

}

function ensureBatch(year){

  if(!year) return;

  if(!getBatch(year)){

    data.batches.push({
      id:uid("batch"),
      year,
      notes:"",
      active:true
    });

    data.batches.sort((a,b)=>Number(a.year)-Number(b.year));

  }

}

function submitLeadershipForm(e,id){

  e.preventDefault();

  const obj=Object.fromEntries(new FormData(e.target).entries());

  obj.yearFrom=Number(obj.yearFrom);
  obj.yearTo=obj.yearTo ? Number(obj.yearTo):"";
  obj.updatedAt=now();

  if(isAdmin()){

    if(id){

      const existing=data.leadership.find(x=>x.id===id);

      if(existing) Object.assign(existing,obj);

      audit("Mengemas kini kepimpinan","Kepimpinan",id);

    }else{

      obj.id=uid("lead");
      obj.createdAt=now();

      data.leadership.push(obj);

      audit("Menambah kepimpinan","Kepimpinan",obj.id);

    }

    ensureBatch(obj.yearFrom);
    if(obj.yearTo) ensureBatch(obj.yearTo);

    save();
    closeModal();
    render();

    toast("Rekod kepimpinan disimpan.","success");

  }else{

    const reason=document.getElementById("suggestionReason")?.value||"";

    submitSuggestion(
      id ? "leadership_edit":"leadership_add",
      id,
      obj,
      reason,
      id ? data.leadership.find(x=>x.id===id):null
    );

    closeModal();

    toast("Cadangan kepimpinan dihantar.","success");

  }

}

  data.leadership=data.leadership.filter(x=>x.id!==id);

function openBatchForm(year=""){

  if(!isAdmin()) return;

  const existing=year ? getBatch(year) : null;

  const b=existing||{};

  openModal(
    existing ? "Edit Batch" : "Tambah Tahun / Batch",
    `

      <form class="form-grid"
        onsubmit="submitBatchForm(event,'${esc(String(year))}')">

        ${inputField("Tahun","year",b.year||"","number",true)}

        ${selectField(
          "Status",
          "active",
          [
            {value:"true",label:"Aktif"},
            {value:"false",label:"Tidak aktif"}
          ],
          String(b.active!==false)
        )}

        ${textareaField("Catatan Batch","notes",b.notes)}

        <div class="form-actions">

          <button type="button" class="btn" onclick="closeModal()">
            Batal
          </button>

          <button class="btn btn-primary">
            Simpan
          </button>

        </div>

      </form>

    `,
    "Pengurusan tahun / batch",
    false
  );

}

function submitBatchForm(e,oldYear){

  e.preventDefault();

  const obj=Object.fromEntries(new FormData(e.target).entries());

  const year=Number(obj.year);

  if(!year || year<1900){
    toast("Tahun tidak sah.","error");
    return;
  }

  if(oldYear){

    const existing=getBatch(Number(oldYear));

    if(existing){

      existing.year=year;
      existing.active=obj.active!=="false";
      existing.notes=obj.notes;

    }

  }else{

    if(getBatch(year)){
      toast("Tahun tersebut sudah wujud.","error");
      return;
    }

    data.batches.push({
      id:uid("batch"),
      year,
      active:obj.active!=="false",
      notes:obj.notes
    });

  }

  data.batches.sort((a,b)=>Number(a.year)-Number(b.year));

  audit(
    oldYear ? "Mengemas kini batch":"Menambah batch",
    "Batch",
    String(year)
  );

  save();

  closeModal();

  render();

  toast("Batch berjaya disimpan.","success");

}
